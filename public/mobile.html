<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LIVE MINIATURE · 모바일 안내</title>
<style>
:root{--navy:#10294b;--blue:#176dff;--teal:#11ae98;--muted:#718198;--line:#e4edf1}*{box-sizing:border-box}body{margin:0;background:#f4f8fb;color:var(--navy);font-family:Inter,"Noto Sans KR",Arial,sans-serif}.phone{max-width:470px;min-height:100vh;margin:auto;background:#fff;box-shadow:0 0 38px #cddde655}.top{display:flex;justify-content:space-between;align-items:center;padding:20px 22px 10px}.brand{font-size:17px;font-weight:900;letter-spacing:.05em}.brand small{display:block;font-size:10px;color:var(--teal);letter-spacing:.15em;margin-top:4px}.qr{border:0;background:#ecfbf7;color:#079b88;border-radius:99px;padding:9px 12px;font-weight:800}.hero{padding:10px 22px 15px}.eyebrow{color:var(--teal);font-size:11px;font-weight:900;letter-spacing:.08em}.hero h1{font-size:27px;margin:6px 0}.muted{color:var(--muted);font-size:13px}.map-wrap{margin:0 14px;border:1px solid #dce8ed;border-radius:23px;overflow:hidden;background:linear-gradient(145deg,#effaf7,#edf4ff);box-shadow:0 9px 25px #315c7915}.map{width:100%;display:block}.space{stroke:#abcbd2;stroke-width:3}.label{fill:var(--navy);font-size:16px;font-weight:900}.route{fill:none;stroke:var(--blue);stroke-width:15;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 19}.pin{fill:#ef5757;stroke:#fff;stroke-width:5}.current{fill:var(--blue);stroke:#fff;stroke-width:6}.card{margin:16px 14px;padding:18px;border:1px solid var(--line);border-radius:19px;box-shadow:0 9px 24px #315c7912}.row{display:flex;justify-content:space-between;gap:12px}.destination{font-size:21px;font-weight:900;margin-top:5px}.chip{height:max-content;padding:7px 10px;border-radius:99px;background:#e9fbf7;color:#078e7c;font-size:11px;font-weight:900}.instruction{display:flex;align-items:center;gap:13px;margin-top:16px;padding:14px;background:#f5f8fc;border-radius:14px}.arrow{font-size:35px;color:var(--blue);font-weight:900}.instruction b{display:block;font-size:18px}.instruction span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.stats{display:flex;gap:26px;margin-top:17px;color:var(--muted);font-size:11px}.stats b{display:block;color:var(--navy);font-size:17px;margin-top:3px}.actions{display:flex;gap:9px;margin-top:17px}.button{flex:1;border:0;border-radius:12px;padding:13px;font-weight:900}.primary{background:var(--blue);color:#fff}.ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}.notice{margin:0 14px 24px;padding:13px 15px;background:#effbf8;color:#168474;border-radius:13px;font-size:12px;line-height:1.6}.mobile-footer{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:14px;color:#8493a3;font-size:11px}.mobile-footer b{color:var(--blue)}
</style></head><body><div class="phone"><header class="top"><div class="brand">LIVE MINIATURE<small>실시간 실내 내비게이션</small></div><button class="qr">▦ QR 진입</button></header><section class="hero"><div class="eyebrow" id="venue">VENUE-001 · 행사장 A</div><h1 id="destination">전시장 A</h1><div class="muted">현재 위치에서 혼잡을 피한 빠른 경로를 안내합니다.</div></section><div class="map-wrap"><svg class="map" viewBox="0 0 1200 800"><rect x="70" y="120" width="1060" height="580" rx="12" fill="#fff" stroke="#d6e3e8" stroke-width="10"/><g id="spaces"></g><polyline id="route" class="route" points="145,615 270,615 270,450 470,450 470,260 715,260 715,405 940,405"/><circle class="current" cx="145" cy="615" r="17"/><path class="pin" d="M940 376c-18 0-29 14-29 29 0 22 29 51 29 51s29-29 29-51c0-15-11-29-29-29z"/><circle cx="940" cy="405" r="8" fill="#fff"/></svg></div><section class="card"><div class="row"><div><div class="eyebrow">추천 경로</div><div class="destination" id="routeTitle">전시장 A 입구</div></div><span class="chip" id="congestion">여유</span></div><div class="instruction"><div class="arrow">↑</div><div><b id="instruction">직진</b><span id="distance">다음 안내까지 35m</span></div></div><div class="stats"><div>예상 시간<b id="time">2분</b></div><div>거리<b id="meters">110m</b></div><div>경로 상태<b>추천 경로</b></div></div><div class="actions"><button class="button ghost" id="recenter">현재 위치</button><button class="button primary" id="finish">경로 종료</button></div></section><div class="notice">실시간 혼잡도가 바뀌면 더 빠르고 편한 경로를 자동으로 다시 안내합니다.</div><footer class="mobile-footer"><b>⌂ 지도</b><span>♧ 목적지</span><span>☰ 더보기</span></footer></div>
<script>
const svgNS='http://www.w3.org/2000/svg';const colors={LOW:'#c9f2ea',NORMAL:'#fff0cf',HIGH:'#ffe0dc',CLOSED:'#e4e9ef'};const params=new URLSearchParams(location.search);const mapId=params.get('map')||'venue-001';const start=params.get('start');const spaceGroup=document.getElementById('spaces');
function pathFor(map,a,b){const q=[a],prev={[a]:null};while(q.length){const id=q.shift();if(id===b)break;map.edges.filter(e=>e.from===id||e.to===id).forEach(e=>{const n=e.from===id?e.to:e.from;if(prev[n]===undefined){prev[n]=id;q.push(n)}})}if(prev[b]===undefined)return[];const out=[];for(let id=b;id!==null;id=prev[id])out.unshift(map.nodes.find(n=>n.id===id));return out.filter(Boolean)}
async function load(){try{const map=await (await fetch('/api/maps/'+mapId)).json();document.getElementById('venue').textContent=map.mapId.toUpperCase()+' · 행사장 안내';const spaces=map.spaces||[];spaces.slice(0,8).forEach(s=>{const p=s.polygon||[];if(p.length<4)return;const poly=document.createElementNS(svgNS,'polygon');poly.setAttribute('points',p.map(x=>x.join(',')).join(' '));poly.setAttribute('class','space');poly.setAttribute('fill',colors[s.congestion]||'#eef5f7');spaceGroup.appendChild(poly);const label=document.createElementNS(svgNS,'text');label.setAttribute('x',p[0][0]+14);label.setAttribute('y',p[0][1]+28);label.setAttribute('class','label');label.textContent=s.name;spaceGroup.appendChild(label)});const from=map.nodes.find(n=>n.id===start)||map.nodes.find(n=>n.kind==='ENTRANCE')||map.nodes[0],to=map.nodes.find(n=>n.kind==='DESTINATION')||map.nodes[map.nodes.length-1],route=pathFor(map,from.id,to.id);if(route.length>1)document.getElementById('route').setAttribute('points',route.map(n=>`${n.x},${n.y}`).join(' '));const destination=spaces.find(s=>s.id===to.spaceId)||spaces.find(s=>s.type==='EXHIBITION')||spaces[0];if(destination){document.getElementById('destination').textContent=destination.name;document.getElementById('routeTitle').textContent=destination.name+' 입구';document.getElementById('congestion').textContent=destination.congestion==='HIGH'?'혼잡':destination.congestion==='LOW'?'여유':'보통';document.getElementById('congestion').style.background=colors[destination.congestion]||'#e9fbf7'}}catch(e){console.error(e)}}load();document.getElementById('finish').onclick=()=>{document.getElementById('instruction').textContent='경로 종료';document.getElementById('distance').textContent='새 목적지를 선택해 주세요.'};document.getElementById('recenter').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
</script></body></html>
