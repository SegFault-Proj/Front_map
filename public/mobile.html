<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>LIVE MINIATURE · 실내 내비게이션</title>
<style>
:root{--navy:#10294b;--blue:#176dff;--teal:#10ae98;--red:#ef625e;--muted:#718198;--line:#e4edf1}*{box-sizing:border-box}body{margin:0;background:#edf6f7;color:var(--navy);font-family:Inter,"Noto Sans KR",Arial,sans-serif}.phone{max-width:480px;min-height:100vh;margin:auto;background:linear-gradient(#fff 0 44%,#f5fbfb);box-shadow:0 0 42px #29465c20;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;padding:20px 21px 10px}.brand{font-weight:900;letter-spacing:.06em;font-size:16px}.brand small{display:block;margin-top:4px;color:var(--teal);font-size:9px;letter-spacing:.13em}.qr{border:0;border-radius:99px;padding:9px 13px;background:#eafaf7;color:#078e7d;font-weight:900}.hero{padding:12px 22px 16px}.eyebrow{font-size:10px;letter-spacing:.1em;color:var(--teal);font-weight:900}.hero h1{font-size:27px;letter-spacing:-.06em;margin:6px 0}.muted{font-size:12px;color:var(--muted)}.status-row{display:flex;gap:7px;align-items:center;margin-top:11px}.chip{padding:6px 9px;border-radius:99px;font-size:10px;font-weight:900;background:#e8fbf7;color:#078e7d}.chip.red{background:#ffe5e3;color:#d85050}.metric{font-size:11px;color:var(--muted)}.map-card{position:relative;margin:0 14px;height:350px;overflow:hidden;border:1px solid #dce9ed;border-radius:24px;background:linear-gradient(145deg,#effaf8,#edf3ff);box-shadow:0 12px 28px #315c7918}.map-card img{width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(.92) brightness(1.03)}.map-card:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 65%,#10294b30);pointer-events:none}.route{position:absolute;z-index:2;inset:0;width:100%;height:100%;pointer-events:none}.route polyline{fill:none;stroke:#fff;stroke-width:24;stroke-linecap:round;stroke-linejoin:round}.route .blue{stroke:var(--blue);stroke-width:14;stroke-dasharray:2 24;filter:drop-shadow(0 4px 4px #176dff66)}.current{fill:#176dff;stroke:#fff;stroke-width:8}.destination{fill:var(--red);stroke:#fff;stroke-width:8}.map-badge{position:absolute;z-index:3;padding:8px 10px;border-radius:11px;background:#fffffff0;border:1px solid #d9e8e9;box-shadow:0 6px 14px #315c7920;font-size:10px;font-weight:900}.map-badge small{display:block;color:var(--teal);font-size:8px;margin-top:3px}.badge-a{left:10px;bottom:72px}.badge-b{right:12px;top:22px}.map-tools{position:absolute;z-index:3;right:11px;bottom:12px;display:grid;gap:6px}.map-tools button{width:39px;height:39px;border:1px solid #dbe7eb;border-radius:12px;background:#fffffff0;color:var(--navy);font-size:17px;box-shadow:0 5px 12px #315c7920}.direction{margin:14px;padding:17px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 10px 26px #315c7914}.direction-top{display:flex;justify-content:space-between;align-items:start}.direction small{font-size:10px;color:var(--muted)}.direction h2{font-size:23px;margin:4px 0}.turn{display:flex;align-items:center;gap:13px;margin-top:13px;padding:13px;border-radius:14px;background:#f5f8fc}.turn-icon{font-size:38px;color:var(--blue);font-weight:900}.turn b{display:block;font-size:17px}.turn span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.stats{display:flex;gap:28px;margin-top:15px;color:var(--muted);font-size:10px}.stats b{display:block;color:var(--navy);font-size:16px;margin-top:3px}.guide{display:flex;align-items:center;gap:11px;margin:0 14px 14px;padding:10px 13px;border:1px solid #d8f0eb;border-radius:17px;background:#edfaf7}.guide img{width:55px;height:65px;object-fit:contain}.guide strong{display:block;color:#0e9584;font-size:12px}.guide p{margin:5px 0 0;color:#7890a1;font-size:10px;line-height:1.4}.actions{display:flex;gap:8px;margin:0 14px 18px}.actions button{flex:1;border-radius:13px;padding:13px;border:1px solid var(--line);background:#fff;color:var(--red);font-weight:900}.actions .primary{border:0;background:var(--blue);color:#fff}.footer{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:14px 0 calc(14px + env(safe-area-inset-bottom));background:#fff;color:#91a0ad;font-size:10px}.footer b{color:var(--blue)}@media(min-width:600px){body{padding:24px 0}.phone{border-radius:30px;min-height:calc(100vh - 48px);overflow:hidden}}
</style></head><body><div class="phone"><header class="top"><div class="brand">LIVE MINIATURE<small>실시간 실내 내비게이션</small></div><button class="qr" onclick="location.reload()">▣ QR 진입</button></header><section class="hero"><div class="eyebrow" id="venue">VENUE-001 · 행사장 안내</div><h1 id="destination">전시장 B</h1><div class="muted">현재 위치에서 혼잡을 피한 빠른 경로를 안내합니다.</div><div class="status-row"><span class="chip" id="crowd">여유</span><span class="metric" id="summary">추천 경로 · AI/fallback 연결 중</span></div></section><div class="map-card"><img src="/venue-001-3d-render.png" alt="도면 기반 3D 실내 지도"/><svg class="route" viewBox="0 0 1200 800" preserveAspectRatio="none"><polyline points="110,650 310,650 310,440 470,440 470,270 700,270 700,410 940,410"/><polyline class="blue" points="110,650 310,650 310,440 470,440 470,270 700,270 700,410 940,410"/><circle class="current" cx="110" cy="650" r="18"/><circle class="destination" cx="940" cy="410" r="18"/></svg><div class="map-badge badge-a">안내데스크<small>여유 · 현재 위치</small></div><div class="map-badge badge-b" id="destinationBadge">전시장 B<small>추천 목적지</small></div><div class="map-tools"><button>3D</button><button>⌁</button><button>◖</button></div></div><section class="direction"><div class="direction-top"><div><small>다음 안내</small><h2 id="instruction">직진 후 오른쪽</h2></div><div class="metric" id="nextDistance">35m 앞</div></div><div class="turn"><div class="turn-icon">↑</div><div><b>직진</b><span>안내데스크를 지나 중앙 통로로 이동하세요.</span></div></div><div class="stats"><div>예상 시간<b id="time">2분</b></div><div>거리<b id="meters">110m</b></div><div>경로 상태<b>혼잡 회피</b></div></div></section><div class="guide"><img src="/characters/luna.png" alt="루나 가이드"/><div><strong>루나가 함께 안내하고 있어요</strong><p>혼잡도가 바뀌면 더 편한 경로로 자동 재탐색합니다.</p></div></div><div class="actions"><button onclick="window.scrollTo({top:0,behavior:'smooth'})">현재 위치</button><button class="primary" onclick="document.getElementById('instruction').textContent='경로 종료';document.getElementById('nextDistance').textContent='새 목적지를 선택해 주세요.'">경로 종료</button></div><footer class="footer"><b>⌂ 지도</b><span>♧ 목적지</span><span>☰ 더보기</span></footer></div>
<script>
const params=new URLSearchParams(location.search),mapId=params.get('map')||'venue-001',start=params.get('start')||'NODE_01';
async function load(){try{const map=await (await fetch('/api/maps/'+mapId)).json();const destination=map.spaces.find(space=>space.id==='SPACE_06')||map.spaces.find(space=>space.type==='EXHIBITION')||map.spaces[0];if(destination){document.getElementById('destination').textContent=destination.name;document.getElementById('destinationBadge').childNodes[0].textContent=destination.name;const crowd=document.getElementById('crowd');crowd.textContent=destination.congestion==='HIGH'?'혼잡':destination.congestion==='LOW'?'여유':'보통';crowd.className='chip '+(destination.congestion==='HIGH'?'red':'')}const response=await fetch('/api/ai/routes/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mapId,startNodeId:start,destinationNodeId:'NODE_08'})});const body=await response.json();const data=body.data||body;document.getElementById('summary').textContent=(data.source==='fallback'?'fallback':'AI')+' 경로 · 실시간 반영';document.getElementById('meters').textContent=Math.round(data.totalDistance||110)+'m';document.getElementById('time').textContent=Math.max(1,Math.ceil((data.estimatedSeconds||120)/60))+'분'}catch(error){document.getElementById('summary').textContent='샘플 경로 · API 연결 대기'}}load();
</script><script src="/mobile-override.js"></script></body></html>
