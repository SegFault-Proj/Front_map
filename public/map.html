<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Miniature · 길 안내</title>
<style>
:root{--navy:#142b4a;--blue:#1677ff;--teal:#12a896;--muted:#718096;--line:#e3ebf1}*{box-sizing:border-box}body{margin:0;background:#f5f9fb;color:var(--navy);font-family:Inter,Pretendard,Arial,sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 36px #dbe7ed}.top{padding:20px 22px 14px;display:flex;justify-content:space-between}.brand{font-weight:800}.brand small{display:block;color:var(--teal);font-size:11px;margin-bottom:5px}.qr{color:var(--blue);font-size:12px;font-weight:800}.hero{padding:4px 22px 16px}.hero h1{font-size:25px;margin:5px 0}.sub{color:var(--muted);font-size:13px}.map{margin:0 14px;border-radius:20px;background:linear-gradient(145deg,#eff8f7,#edf3f8);overflow:hidden}.map svg{width:100%;display:block}.route{fill:none;stroke:var(--blue);stroke-width:13;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 20}.space{stroke:#b9d2d5;stroke-width:3}.label{fill:var(--navy);font-size:16px;font-weight:800}.pin{fill:#ef4444;stroke:#fff;stroke-width:5}.current{fill:#1677ff;stroke:#fff;stroke-width:6}.card{margin:16px 14px;padding:17px;border:1px solid var(--line);border-radius:17px;box-shadow:0 8px 24px #dce7ed66}.row{display:flex;justify-content:space-between}.eyebrow{font-size:11px;color:var(--teal);font-weight:800;letter-spacing:.08em}.destination{font-size:20px;font-weight:800;margin:5px 0}.chip{font-size:11px;background:#e8fbf7;color:#078c7d;padding:7px 10px;border-radius:999px;font-weight:800}.instruction{margin-top:16px;padding:14px;background:#f5f8fc;border-radius:13px;display:flex;align-items:center;gap:12px}.arrow{font-size:32px;color:var(--blue);font-weight:800}.instruction b{display:block;font-size:17px}.instruction span{color:var(--muted);font-size:12px}.stats{display:flex;gap:20px;margin-top:15px;color:var(--muted);font-size:12px}.stats b{display:block;color:var(--navy);font-size:16px;margin-top:3px}.actions{display:flex;gap:9px;margin-top:15px}.button{flex:1;border:0;border-radius:11px;padding:13px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}.notice{margin:0 14px 22px;padding:12px 14px;background:#effbf8;color:#147f72;border-radius:12px;font-size:12px;line-height:1.5}
</style></head><body><div class="app"><header class="top"><div class="brand"><small>LIVE MINIATURE</small>실시간 길 안내</div><div class="qr">▣ QR 진입 완료</div></header><section class="hero"><div class="eyebrow">VENUE-001 · 행사장 A</div><h1 id="destination">전시관 B</h1><div class="sub">현재 위치에서 가장 빠른 경로를 안내합니다.</div></section>
<div class="map"><svg viewBox="0 0 1200 800"><rect x="70" y="120" width="1060" height="580" rx="10" fill="#fbfefe" stroke="#d6e3e8" stroke-width="10"/><polygon class="space" points="105,485 270,485 270,615 105,615" fill="#c9f2ea"/><polygon class="space" points="300,180 520,180 520,450 300,450" fill="#dbeafe"/><polygon class="space" points="550,180 715,180 715,405 550,405" fill="#fff0cf"/><polygon class="space" points="745,180 1010,180 1010,405 745,405" fill="#ffe0dc"/><polygon class="space" points="550,450 760,450 760,650 550,650" fill="#e8ddff"/><text class="label" x="565" y="505">전시관 B</text><text class="label" x="315" y="215">전시관 A</text><polyline class="route" id="demoRoute" points="145,615 270,615 270,450 470,450 470,260 715,260 715,405 940,405" opacity=".22"/><polyline class="route" id="apiRoute" points="145,615 940,405"/><circle class="current" cx="145" cy="615" r="17"/><path class="pin" d="M940 376c-18 0-29 14-29 29 0 22 29 51 29 51s29-29 29-51c0-15-11-29-29-29z"/><circle cx="940" cy="405" r="8" fill="#fff"/></svg></div>
<section class="card"><div class="row"><div><div class="eyebrow">추천 경로</div><div class="destination" id="routeTitle">전시관 B 입구</div></div><span class="chip">여유</span></div><div class="instruction"><div class="arrow">↗</div><div><b id="instruction">직진 후 오른쪽</b><span id="distance">다음 안내까지 35m</span></div></div><div class="stats"><div>예상 시간<b id="time">2분</b></div><div>거리<b id="meters">110m</b></div><div>경로 상태<b>혼잡 회피</b></div></div><div class="actions"><button class="button ghost" id="recenter">현재 위치로</button><button class="button primary" id="finish">경로 종료</button></div></section><div class="notice">실시간 혼잡도가 바뀌면 더 빠른 경로로 자동 재탐색합니다. 지도는 QR의 mapId와 start 값을 기준으로 시작 위치를 설정합니다.</div></div>
<script>
const params=new URLSearchParams(location.search),start=params.get('start')||'entrance-a';
const destinations={'entrance-a':{name:'전시관 B',time:'2분',meters:'110m',instruction:'직진 후 오른쪽',distance:'다음 안내까지 35m'},'main-gate':{name:'안내데스크',time:'1분',meters:'65m',instruction:'왼쪽 통로로 직진',distance:'다음 안내까지 20m'}};
const d=destinations[start]||destinations['entrance-a'];
document.getElementById('destination').textContent=d.name;document.getElementById('routeTitle').textContent=d.name+' 입구';document.getElementById('time').textContent=d.time;document.getElementById('meters').textContent=d.meters;document.getElementById('instruction').textContent=d.instruction;document.getElementById('distance').textContent=d.distance;
function graphRoute(map,startId,destinationId){const queue=[startId],previous={[startId]:null};while(queue.length){const current=queue.shift();if(current===destinationId)break;map.edges.filter(edge=>edge.from===current||edge.to===current).forEach(edge=>{const next=edge.from===current?edge.to:edge.from;if(previous[next]===undefined){previous[next]=current;queue.push(next)}})}if(previous[destinationId]===undefined)return[];const ids=[];for(let id=destinationId;id!==null;id=previous[id])ids.unshift(id);return ids.map(id=>map.nodes.find(node=>node.id===id)).filter(Boolean)}
async function loadPublishedMap(){const mapId=location.pathname.split('/').filter(Boolean)[1]||'venue-001';try{const response=await fetch('/api/maps/'+mapId);if(!response.ok)throw new Error();const map=await response.json();const destination=map.spaces.find(space=>space.id==='SPACE_06')||map.spaces.find(space=>space.type==='EXHIBITION');const requestedStart=map.nodes.find(node=>node.id===start);const startNode=requestedStart||map.nodes.find(node=>node.kind==='ENTRANCE')||map.nodes[0];const destinationNode=map.nodes.find(node=>node.kind==='DESTINATION')||map.nodes[map.nodes.length-1];const route=graphRoute(map,startNode.id,destinationNode.id);const edgeDistance=route.slice(1).reduce((sum,node,index)=>sum+(map.edges.find(edge=>(edge.from===route[index].id&&edge.to===node.id)||(edge.to===route[index].id&&edge.from===node.id))?.distance||0),0);document.getElementById('apiRoute').setAttribute('points',route.map(node=>`${node.x},${node.y}`).join(' '));document.getElementById('demoRoute').setAttribute('opacity','.08');if(destination){document.getElementById('destination').textContent=destination.name;document.getElementById('routeTitle').textContent=destination.name+' 입구'}document.getElementById('meters').textContent=Math.max(1,Math.round(edgeDistance/10))+'m';document.getElementById('time').textContent=Math.max(1,Math.ceil(edgeDistance/600))+'분';document.getElementById('distance').textContent='전체 경로 '+route.length+'개 노드';document.querySelector('.eyebrow').textContent=map.mapId.toUpperCase()+' · 게시된 지도'}catch{document.querySelector('.notice').textContent='게시된 지도 데이터를 불러오지 못해 데모 경로를 표시하고 있습니다.'}}
loadPublishedMap();
document.getElementById('recenter').onclick=()=>alert('현재 위치 NODE_01로 재설정했습니다.');document.getElementById('finish').onclick=()=>{document.getElementById('instruction').textContent='경로 안내가 종료되었습니다';document.getElementById('distance').textContent='필요할 때 다시 안내를 시작할 수 있어요.'};
</script></body></html>
